name: ci-cd

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      REACT_APP_API_URL: http://localhost:3009
      REACT_APP_API_GRAPHQL_URL: http://localhost:3009/graphql
      REACT_APP_API_WS: ws://localhost:3009
      REACT_APP_SITE_URL: http://localhost:3000
      REACT_APP_GOOGLE_CLIENT_ID: ci-placeholder
      REACT_APP_KAKAO_REST_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn build

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency: deploy-production-next
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
            set -e
            cd ~/apps/auctra-next
            git pull --ff-only origin master
            cd ~/apps/auctra
            docker compose -f docker-compose.prod.yml up -d --build next
            docker image prune -f
          '
